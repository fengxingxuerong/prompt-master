[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-master"
# 版本号不写死在这里：唯一事实源是 pm/__init__.py 的 __version__。
# 原先这里 1.1.0、pm/__init__ 2.0.0、pm/server 自报 2.1.0 三处互不相认，
# 谁都不敢说"当前版本是多少"（2026-09-25 收口，tests/test_version_single_source.py 守住）。
dynamic = ["version"]
description = "提示词自动生成 / 测试 / 评估 / 迭代优化闭环（LangGraph）"
requires-python = ">=3.11"
# 与 requirements.txt 保持同一组实测通过的版本号（tests/test_packaging.py 会比对两边，防漂移）。
# 以前这里是空的、依赖全在 requirements.txt，导致 `pip install .` 装出来是个跑不起来的空壳。
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-core==1.6.2",
    "langchain-openai==1.6.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    # pm/mcp_server.py（智能体标准协议接入）。必须 <2：mcp 2.x 会把 starlette 顶到
    # 与 fastapi 0.115 冲突的版本（实测 2.2.0 装完 pm.server 直接 import 失败）
    "mcp==1.30.0",
]

[project.optional-dependencies]
# 使用 Anthropic 作为 Provider 时才需要
anthropic = ["langchain-anthropic>=0.3.0"]
# 开发与门禁（pytest/ruff/mypy 已在 requirements.txt 里钉住）
# pytest-cov/coverage：覆盖率统计（2026-09-13 测试时发现原本没装，补进 dev 组，
# 避免下次还得临时 pip install 才能出覆盖率数字）
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.0",
]

[tool.setuptools]
# 平铺布局下 setuptools 自动发现会把 run.py / run_server.py 当成顶层模块，
# 这里只安装 pm 包（含 pm.nodes / pm.cli / pm.web 子包）；两个入口脚本依旧用 `python run.py ...` 从仓根跑。
packages = ["pm", "pm.nodes", "pm.cli", "pm.web", "pm.modelhub"]

[tool.setuptools.dynamic]
# 见 [project] 的 dynamic：版本号取自 pm/__init__.py:__version__（setuptools 按 AST 静态读，不 import）
version = {attr = "pm.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# 只量 pm/：两个入口薄壳的行为由 subprocess 打真实入口的用例覆盖（不在分母里说事）
source = ["pm"]

[tool.coverage.report]
# 地板值来自 2026-09-25 实测：全量 84%，拆开看 pm/modelhub/* 只有 33.5%、其余 95.6%。
# 这条线的含义是"别再往下掉"，不是质量目标（分项那条更紧的闸见 ci.yml）。
# 为什么现在才加：以前仓库里根本没有覆盖率门禁，文档写的"94%"是手抄快照
# —— 2026-09-25 实测 84%，虚高 10 个点。
fail_under = 82
show_missing = true

[tool.coverage.json_report]
output_file = "coverage.json"

[tool.ruff]
# 目标语法：项目 README 推荐 python3.11
target-version = "py311"
line-length = 100
src = ["pm", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade（现代化语法）
    "B",      # flake8-bugbear（常见 bug 模式）
    "BLE",    # flake8-blind-except（盲捕；代码中已有 noqa: BLE001 显式豁免）
    "C4",     # flake8-comprehensions
    "RUF",    # ruff 专属
]
ignore = [
    "E501",   # 行长 100 内即可，不强制 79
    "RUF001", # 混淆字符检测对中文/全角标点误报严重
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"releases/suite/watchdog_suite.py" = ["E402", "BLE001"]
"releases/suite/monitor_suite.py" = ["E402", "BLE001"]
"releases/suite/rotate_ledger.py" = ["E402"]
"releases/suite/five_dim_audit.py" = ["E402", "BLE001", "RUF059"]
"releases/suite/smoke_suite.py" = ["E402", "BLE001", "B007", "I001", "E401"]
"releases/suite/*.py" = ["E402"]

# 测试代码允许相对宽松
"tests/*" = ["B011"]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["pm", "run.py", "run_server.py"]
# LangGraph / LangChain 无完整 stub，忽略缺失 import
ignore_missing_imports = true
# 不跟随解析第三方包（numpy 等 stub 在 3.13 下有语法兼容问题，且非本项目代码）
follow_imports = "skip"
# 2026-09-17 起全量 strict：存量代码在 check_untyped_defs 档位本就 0 错，
# 满血 strict 的缺口（裸泛型 / 缺签名 / 返回 Any）已全部修齐
strict = true

[[tool.mypy.overrides]]
# pydantic BaseModel 因 follow_imports=skip 被判 Any，继承它的模型类只能豁免
# disallow_subclassing_any；模型字段本身均已完整标注
module = ["pm.schemas", "pm.llm", "pm.assertions", "pm.server", "pm.modelhub.server"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# FastAPI / FastMCP / pydantic 的装饰器因 follow_imports=skip 被判 untyped，
# 被装饰函数本身均已完整标注；只放开装饰器这一项，其余 strict 规则照常。
# pm.modelhub.server 于 2026-09-25 补进来：同样是 FastAPI 路由写法，但建 modelhub
# 目录时漏了这步 ⇒ 18 条 untyped-decorator 一直挂在 CI 上（HEAD 是红的）。
module = ["pm.server", "pm.mcp_server", "pm.schemas", "pm.modelhub.server"]
disallow_untyped_decorators = false
