[pytest]
testpaths = tests
# 临时根**不写在这里**：由同目录的 conftest.py 复用仓根"先探再选"的判据。
# 两个动机都在仓根 conftest.py 的文档字符串里，这里只记本目录这一份的成因：
#   · 现象一：Windows 上 pytest 退出期会 stat %TEMP% 里的 pytest-current 软链，本机它坏到
#     readlink 都抛 WinError 5 ⇒ 清理函数自己崩，用例全过也返回 rc=1（CI 在 ubuntu 不复现）；
#   · 现象二（2026-10-13，上一修法的副作用）：写死的 `.pytest_tmp` 自己被宿主打坏 ACL 后，
#     本套件 17/38 条卡在 setup ERROR，而静态门禁全绿。
# 本目录自带 pytest.ini ⇒ rootdir 落在这里、够不到仓根 conftest.py，所以加一个只负责
# "加载仓根选择器"的 conftest，而不是把判据复制第二份。
