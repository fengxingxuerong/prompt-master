name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # 门禁工具一律用 requirements.txt 里的钉版本。以前这里额外 `pip install ruff mypy`
        # 不钉版本 ⇒ CI 用的 ruff/mypy 会随上游发版漂移（本地实测 0.16.6 / 2.3.1），
        # "本地绿、CI 红"或反向都解释不了。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff check)
        run: ruff check pm/ tests/ run.py run_server.py examples/
      - name: Format check (ruff format)
        run: ruff format --check pm/ tests/ run.py run_server.py examples/
      - name: Type check (mypy)
        # 与 pyproject 的 [tool.mypy] files 保持一致，别出现"本地查、CI 不查"的第三种口径
        run: mypy pm/ run.py run_server.py
      - name: Tests (pytest) —— 无 Key、且禁止任何真实出网
        # 死端点 + 假 Key 是有意的：只要有一条调用漏到真端点（C5 那类缺陷），
        # 这里就会 Connection error 立刻变红，而不是在开发机上静默烧额度。
        # --cov：覆盖率地板值见 pyproject [tool.coverage.report].fail_under。
        # 注意这个数只算主进程——subprocess 打真实入口的那批用例（test_cli_guards 等）
        # 不计入分子，所以 pm/cli/main.py 的 80% 是偏保守的下界（这个数只作解释，不作判据）。
        env:
          PM_BASE_URL: http://127.0.0.1:9/v1
          PM_EVALUATOR_B_BASE_URL: http://127.0.0.1:9/v1
          PM_ARBITER_BASE_URL: http://127.0.0.1:9/v1
          PM_API_KEY: sk-ci-has-no-real-key
        run: python -m pytest tests/ -q --cov=pm --cov-report=term-missing
      - name: Coverage ratchet —— pm/modelhub/* 单独一条更紧的线
        # 全量线会把结构问题抹平，而恰恰是这块网关出过"流式通道没有 return、stream=true
        # 返回 None、全套测试全绿"的事故（见 tests/test_modelhub_stream_contract.py）——
        # 全局线守不住的地方就用分项线钉住不许再掉。地板取实测下方留 5 点余量。
        # ⚠️ 逐轮实测值只在 docs/operations.md 的表格里维护，别抄进这段注释：
        # 之前这里把两轮的数字并排写着（复测①的分项值与复测③的地板依据），谁也看不出是两个时点。
        # 剩余缺口集中在上游调用体（server.py 的对话主路由与 pool.py 真 urllib 那段），补到那儿之前别抬这条线。
        env:
          PM_API_KEY: sk-ci-has-no-real-key
        run: python -m coverage report --include="*/modelhub/*" --fail-under=82
      - name: Releases suite tests (全部三套) —— TestClient 进程内，零真实出网
        # 2026-09-25 盘点：这一步原来只跑 lobster + triage，`releases/taskboard/tests/`
        # 从没进过 CI —— 于是 taskboard 的鉴权与存储回归只有"有人记得"才跑。
        # 现在新增用例由 tests/test_packaging.py::test_ci_and_docs_run_every_release_suite 钉住。
        run: |
          python -m pytest releases/lobster/tests/ -q
          python -m pytest releases/taskboard/tests/ -q
          python -m pytest releases/triage/tests/ -q
      - name: 运营数据没被测试写脏（必须紧跟上面那三步）
        # 真实事故（2026-09-25 深夜）：跑完 `pytest releases/triage/tests/`，被跟踪的
        # releases/triage/data/{ledger.jsonl,notifications.jsonl,reviewer_health.json} 全被追加了记录。
        # 成因是路由把目录写成现写的 `APP_DIR / "data"`，夹具只封得住 `DATA` 常量。
        # 这条是那一类"路径早晚绑定不一致"的通用闸：谁把常量改回现写表达式，这里就红。
        # 路径写成 `releases/*/data/*` 而不是逐套列举：实测 `releases/*/data` 这种"目录级"
        # glob 在 git pathspec 下**匹配不到任何东西**（rc 恒 0，等于没这条闸），而目录级列举
        # 又会在第四套服务出现时静默漏掉它。
        run: git diff --exit-code -- "releases/*/data/*"
      - name: Topology selftest —— 干净检出无 .env 也必须通过
        env:
          PM_API_KEY: ""
        run: python run.py --selftest
      - name: Stub e2e —— 真实 HTTP 链路与三条结构化输出通道
        env:
          PY: python
          STUB_PY: python
          PORT: "8130"
        run: bash examples/run_e2e_stub.sh

  windows:
    # 覆盖 Windows 侧脚本（run_e2e_stub.ps1 的 UTF-8 / 端口避让 / 任务清理只在 Windows 上成立）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests (pytest)
        env:
          PM_BASE_URL: http://127.0.0.1:9/v1
          PM_API_KEY: sk-ci-has-no-real-key
        run: python -m pytest tests/ -q
      - name: Releases suite tests (全部三套)
        run: |
          python -m pytest releases/lobster/tests/ -q
          python -m pytest releases/taskboard/tests/ -q
          python -m pytest releases/triage/tests/ -q
      - name: 运营数据没被测试写脏（Windows 侧同样要查）
        # 本机就是 Windows：triage 那次污染是在 Windows 上量到的，别只查 linux。
        run: git diff --exit-code -- "releases/*/data/*"
      - name: Stub e2e (PowerShell)
        shell: pwsh
        run: ./examples/run_e2e_stub.ps1
