name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # 门禁工具一律用 requirements.txt 里的钉版本。以前这里额外 `pip install ruff mypy`
        # 不钉版本 ⇒ CI 用的 ruff/mypy 会随上游发版漂移（本地实测 0.16.6 / 2.3.1），
        # "本地绿、CI 红"或反向都解释不了。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff check)
        run: ruff check pm/ tests/ run.py run_server.py examples/
      - name: Format check (ruff format)
        run: ruff format --check pm/ tests/ run.py run_server.py examples/
      - name: Type check (mypy)
        # 与 pyproject 的 [tool.mypy] files 保持一致，别出现"本地查、CI 不查"的第三种口径
        run: mypy pm/ run.py run_server.py
      - name: Tests (pytest) —— 无 Key、且禁止任何真实出网
        # 死端点 + 假 Key 是有意的：只要有一条调用漏到真端点（C5 那类缺陷），
        # 这里就会 Connection error 立刻变红，而不是在开发机上静默烧额度。
        # --cov：覆盖率地板值见 pyproject [tool.coverage.report].fail_under。
        # 注意这个数只算主进程——subprocess 打真实入口的那批用例（test_cli_guards 等）
        # 不计入分子，所以 pm/cli/main.py 的 80% 是偏保守的下界（这个数只作解释，不作判据）。
        env:
          PM_BASE_URL: http://127.0.0.1:9/v1
          PM_EVALUATOR_B_BASE_URL: http://127.0.0.1:9/v1
          PM_ARBITER_BASE_URL: http://127.0.0.1:9/v1
          PM_API_KEY: sk-ci-has-no-real-key
        run: python -m pytest tests/ -q --cov=pm --cov-report=term-missing
      - name: Coverage ratchet —— pm/modelhub/* 单独一条更紧的线
        # 全量线会把结构问题抹平：这块网关补测前只有 33.5%，2026-09-25 复测 69.8%
        # （streaming 89、pool 61、vkeys 85、ledger 94、agents 0→100），而恰恰是它出过
        # "流式通道没有 return、stream=true 返回 None、全套测试全绿"的事故。
        # 全局线守不住的地方，就用分项线钉住不许再掉。地板取实测 69.8% 下方留 4.8 点余量
        # —— 缺口集中在 server.py 49%（运维路由）与 pool.py 61%，补到那儿之前别抬这条线。
        env:
          PM_API_KEY: sk-ci-has-no-real-key
        run: python -m coverage report --include="*/modelhub/*" --fail-under=65
      - name: Releases suite tests (lobster + triage) —— TestClient 进程内，零真实出网
        run: |
          python -m pytest releases/lobster/tests/ -q
          python -m pytest releases/triage/tests/ -q
      - name: Topology selftest —— 干净检出无 .env 也必须通过
        env:
          PM_API_KEY: ""
        run: python run.py --selftest
      - name: Stub e2e —— 真实 HTTP 链路与三条结构化输出通道
        env:
          PY: python
          STUB_PY: python
          PORT: "8130"
        run: bash examples/run_e2e_stub.sh

  windows:
    # 覆盖 Windows 侧脚本（run_e2e_stub.ps1 的 UTF-8 / 端口避让 / 任务清理只在 Windows 上成立）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests (pytest)
        env:
          PM_BASE_URL: http://127.0.0.1:9/v1
          PM_API_KEY: sk-ci-has-no-real-key
        run: python -m pytest tests/ -q
      - name: Releases suite tests (lobster + triage)
        run: |
          python -m pytest releases/lobster/tests/ -q
          python -m pytest releases/triage/tests/ -q
      - name: Stub e2e (PowerShell)
        shell: pwsh
        run: ./examples/run_e2e_stub.ps1
